<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo div com css</title>

    <style>
        div{
            font-size: 28px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }
        #principal{
        background-color: blue;
        border: 3pc solid blueviolet;
        color: white;
    }
    #secundaria{
        background-color: rgb(3, 3, 0);
        border: 3px solid blueviolet;
        color: rgb(218, 214, 26);
    }
    hr{
        border: none;
        border-top: 3px solid gray;
        width: 80%;
    }
    </style>
</head>
<body>
    <div id="principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha.
    </div>
    <hr/>
    <div id="secundaria">
        Esta é a outra divisão de página.
        <br>
        Aqui começa uma nova linha.

    </div>

</body>
</html>
