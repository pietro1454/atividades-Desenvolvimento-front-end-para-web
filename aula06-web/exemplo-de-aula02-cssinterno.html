<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Classes e CSS interior</title>
    <style>
        .titulo{
            color: darkblue;
            text-align: center;
        }
        
        .caixa01{
            background-color: antiquewhite;
            border: 2px solid black;
            padding: 20px;
            margin: 20px;
        }

        .caixa02{
            background-color: rgb(2, 66, 26);
            border: 2px solid rgb(2, 32, 14);
            padding: 20px;
            margin: 20px;
        }

        .destaque01{
            color: red;
            font-weight: bold;
        }
        
        .destaque02{
            color: blueviolet;
            background-color: aliceblue;
            font-style: italic;
            padding: 10px;
        }

    </style>
</head>
<body>
    <h1 class="titulo">Aprendendo classes em CSS</h1>
    <div class="caixa01">
        <p>
            Estou aprendendo a utilizar classes para personalizar
            os elementod de uma página
        </p>
        <br>
        <p class="destaque01">
            Este parágrafo utiliza a classe destaque01
        </p>
        <p class="destaque02">
            Este parágrafo utiliza a classe destaque02
        </p>
        <p class="caixa02">
            Este parágrafo não utiliza nenhuma classe destaque01
        </p>
    </div>

</body>
</html>
